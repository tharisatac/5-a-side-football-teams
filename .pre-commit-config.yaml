repos:
  # Black configuration
  - repo: https://github.com/psf/black
    rev: 25.9.0  # Keep in sync with requirements.txt
    hooks:
      - id: black
        language_version: python3  # Optional: specify Python version

  # Mypy configuration
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2  # Keep in sync with requirements.txt
    hooks:
      - id: mypy
        language_version: python3  # Optional: specify Python version
        # mypy runs in its own environment; give it the libraries whose
        # types it needs to check our code (keep in sync with requirements.txt).
        additional_dependencies: ["psycopg[binary]==3.2.10"]

  # Isort configuration
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1  # Specify the version of isort
    hooks:
      - id: isort
        language_version: python3  # Optional: specify Python version

