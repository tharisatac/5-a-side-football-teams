# Local services.
#   docker compose up -d                       just Postgres, for dev/tests
#   docker compose --profile app up --build    the whole app, port 8080
#   docker compose --profile app down          stop both
# The app connects with DATABASE_URL; tests use a separate "football_test"
# database on the same server, created automatically.
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    # Only started with --profile app, so plain `docker compose up -d`
    # still starts just the database.
    profiles: ["app"]
    environment:
      # Inside Docker the database is reached by its service name, "db".
      DATABASE_URL: postgresql://football:football@db:5432/football
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # Lets `docker compose ps` show when the app is ready. The image has no
    # curl, so Python makes the request. (Cloud Run ignores this and runs
    # its own checks.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
